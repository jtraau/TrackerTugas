<!doctype html>

<html>

  <head>

    <meta charset="utf8" />

    <meta

      name="viewport"

      content="width=device-width,initial-scale=1,viewport-fit=cover"

    />

    <style>

      :root {

        color-scheme: light;

        box-sizing: border-box;

        padding-top: env(safe-area-inset-top, 0px);

        padding-bottom: env(safe-area-inset-bottom, 0px);

      }

      html {

        scroll-padding-top: env(safe-area-inset-top, 0px);

      }

      body {

        margin: 0;

        padding: 0;

        font:

          14px -apple-system,

          BlinkMacSystemFont,

          sans-serif;

        background: #fff;

        color: #000;

      }

      img {

        max-width: 100%;

      }

      [hidden]:not([hidden="until-found" i]) {

        display: none !important;

      }

    </style>

  </head>

  <body>

    <title>Mata Kuliah UT</title>

    <meta name="claude:viewport-fit-sides" content="cover" />

    <link

      rel="stylesheet"

      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@500;700&display=swap"

    />

    <style>

      /* Layout: banyak ruang kosong, angka progres raksasa, matkul sebagai pill, sesi sebagai baris pill yang bisa dicentang, review di samping tiap item. */

      :root {

        --bg: #f5f3fb;

        --surface: #ffffff;

        --ink: #17141f;

        --muted: #6f6a80;

        --line: #e6e2f1;

        --accent: #6d4aff;

        --accent-soft: #ebe6ff;

        --on-accent: #ffffff;

        --done: #1c8f4e;

        --on-done: #ffffff;

        --c-a: #2563eb;

        --c-a-on: #ffffff;

        --c-d: #7c4dff;

        --c-d-on: #ffffff;

        --c-p: #1c8f4e;

        --c-p-on: #ffffff;

        --c-f: #facc15;

        --c-f-on: #2b2100;

        --seg0: #e6e2f1;

        --seg1: #6d4aff;

        --seg2: #1c8f4e;

        --seg2-on: #86efac;

        --font-display: "Unbounded", "DM Sans", system-ui, sans-serif;

        --font-body: "DM Sans", system-ui, sans-serif;

        --font-mono: "DM Mono", ui-monospace, monospace;

      }

      @media (prefers-color-scheme: dark) {

        :root:not([data-theme="light"]) {

          --bg: #131018;

          --surface: #1c1824;

          --ink: #f3f0fa;

          --muted: #9a94ad;

          --line: #2d2839;

          --accent: #a58bff;

          --accent-soft: #2a2146;

          --on-accent: #131018;

          --done: #4ade80;

          --on-done: #052e14;

          --c-a: #60a5fa;

          --c-a-on: #04193a;

          --c-d: #b79cff;

          --c-d-on: #1d0f4d;

          --c-p: #4ade80;

          --c-p-on: #052e14;

          --c-f: #fde047;

          --c-f-on: #2b2100;

          --seg0: #2d2839;

          --seg1: #a58bff;

          --seg2: #4ade80;

          --seg2-on: #14532d;

          color-scheme: dark;

        }

      }

      :root[data-theme="dark"] {

        --bg: #131018;

        --surface: #1c1824;

        --ink: #f3f0fa;

        --muted: #9a94ad;

        --line: #2d2839;

        --accent: #a58bff;

        --accent-soft: #2a2146;

        --on-accent: #131018;

        --done: #4ade80;

        --on-done: #052e14;

        --c-a: #60a5fa;

        --c-a-on: #04193a;

        --c-d: #b79cff;

        --c-d-on: #1d0f4d;

        --c-p: #4ade80;

        --c-p-on: #052e14;

        --c-f: #fde047;

        --c-f-on: #2b2100;

        --seg0: #2d2839;

        --seg1: #a58bff;

        --seg2: #4ade80;

        --seg2-on: #14532d;

        color-scheme: dark;

      }



      * {

        box-sizing: border-box;

      }

      body {

        background: var(--bg);

        color: var(--ink);

        font-family: var(--font-body);

        font-size: 15px;

        line-height: 1.5;

        padding-block: 36px 72px;

        padding-left: max(16px, env(safe-area-inset-left, 0px));

        padding-right: max(16px, env(safe-area-inset-right, 0px));

      }

      .wrap {

        max-width: 56rem;

        margin: 0 auto;

        display: flex;

        flex-direction: column;

        gap: 28px;

      }

      button {

        font: inherit;

        color: inherit;

        cursor: pointer;

      }

      :focus-visible {

        outline: 2px solid var(--accent);

        outline-offset: 2px;

      }



      .titlebar {

        display: flex;

        justify-content: space-between;

        align-items: flex-end;

        gap: 12px;

        flex-wrap: wrap;

      }

      .eyebrow {

        margin: 0;

        font-family: var(--font-mono);

        font-size: 12px;

        letter-spacing: 0.04em;

        color: var(--muted);

      }

      h1 {

        margin: 8px 0 0;

        font-family: var(--font-display);

        font-weight: 700;

        font-size: clamp(1.5rem, 6vw, 2.2rem);

        line-height: 1.15;

        letter-spacing: -0.02em;

        text-wrap: balance;

      }

      .titlewrap {

        flex: 1 1 18rem;

        min-width: 0;

      }

      #title-input {

        width: 100%;

        font: inherit;

        font-weight: inherit;

        letter-spacing: inherit;

        color: inherit;

        background: transparent;

        border: 0;

        border-bottom: 1.5px dotted transparent;

        padding: 0;

        border-radius: 0;

      }

      #title-input:hover {

        border-bottom-color: var(--line);

      }

      #title-input:focus {

        outline: none;

        border-bottom-color: var(--accent);

      }

      .sync {

        margin: 0;

        font-size: 12px;

        color: var(--muted);

        font-family: var(--font-mono);

      }



      .overall {

        display: flex;

        gap: 12px 40px;

        align-items: center;

        flex-wrap: wrap;

        padding-block: 8px;

      }

      .pct {

        font-family: var(--font-display);

        font-weight: 700;

        line-height: 0.95;

        display: flex;

        align-items: baseline;

        gap: 4px;

        letter-spacing: -0.04em;

      }

      .pct-num {

        font-size: clamp(4.5rem, 20vw, 8rem);

        font-variant-numeric: tabular-nums;

      }

      .pct-sign {

        font-size: clamp(1.6rem, 6vw, 2.6rem);

        color: var(--accent);

      }

      .overall-body {

        flex: 1 1 18rem;

        min-width: 0;

        display: flex;

        flex-direction: column;

        gap: 14px;

      }

      .overall-line {

        margin: 0;

        font-size: 16px;

      }

      .overall-line b {

        font-family: var(--font-mono);

        font-weight: 500;

        font-variant-numeric: tabular-nums;

      }

      .bar {

        height: 14px;

        border-radius: 999px;

        background: var(--line);

        overflow: hidden;

      }

      .bar-fill {

        height: 100%;

        background: var(--accent);

        border-radius: 999px;

        transition: width 0.3s ease;

      }

      .types {

        list-style: none;

        margin: 0;

        padding: 0;

        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        font-size: 13px;

      }

      .types li {

        background: var(--surface);

        border-radius: 999px;

        padding: 4px 12px;

        color: var(--muted);

      }

      .types li::before {

        content: "";

        display: inline-block;

        width: 8px;

        height: 8px;

        border-radius: 50%;

        background: var(--c);

        margin-right: 8px;

      }

      .types b {

        font-family: var(--font-mono);

        font-weight: 500;

        color: var(--ink);

        font-variant-numeric: tabular-nums;

        margin-left: 6px;

      }



      .switch {

        display: flex;

        gap: 8px;

        flex-wrap: wrap;

      }

      .switch button {

        border: 0;

        background: transparent;

        padding: 8px 16px;

        border-radius: 999px;

        font-weight: 500;

        color: var(--muted);

        display: inline-flex;

        gap: 8px;

        align-items: center;

        box-shadow: inset 0 0 0 1.5px var(--line);

      }

      .switch button:hover {

        color: var(--ink);

      }

      .switch button[aria-pressed="true"] {

        background: var(--ink);

        color: var(--bg);

        box-shadow: none;

      }

      .badge {

        font-family: var(--font-mono);

        font-size: 12px;

        background: var(--accent);

        color: var(--on-accent);

        padding: 0 8px;

        border-radius: 999px;

        font-variant-numeric: tabular-nums;

      }



      .tabs {

        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));

        gap: 10px;

      }

      .tab {

        text-align: left;

        background: var(--surface);

        border: 0;

        border-radius: 22px;

        padding: 14px 16px;

        display: flex;

        flex-direction: column;

        gap: 14px;

        min-width: 0;

      }

      .tab:hover {

        background: var(--accent-soft);

      }

      .tab[aria-pressed="true"] {

        background: var(--accent);

        color: var(--on-accent);

      }

      .tab-top {

        display: flex;

        flex-direction: column;

        gap: 4px;

        min-width: 0;

        flex: 1;

      }

      .tab-name {

        font-weight: 700;

        overflow-wrap: anywhere;

        line-height: 1.25;

      }

      .tab-num {

        font-family: var(--font-mono);

        font-size: 12px;

        opacity: 0.7;

        font-variant-numeric: tabular-nums;

        white-space: nowrap;

      }

      .segs {

        display: flex;

        gap: 4px;

      }

      .seg {

        width: 9px;

        height: 9px;

        border-radius: 50%;

        background: var(--seg0);

      }

      .seg.s1 {

        background: var(--seg1);

      }

      .seg.s2 {

        background: var(--seg2);

      }

      .tab[aria-pressed="true"] .seg {

        background: rgba(255, 255, 255, 0.3);

      }

      .tab[aria-pressed="true"] .seg.s1 {

        background: #fff;

      }

      .tab[aria-pressed="true"] .seg.s2 {

        background: var(--seg2-on);

      }

      :root[data-theme="dark"] .tab[aria-pressed="true"] .seg {

        background: rgba(19, 16, 24, 0.3);

      }

      :root[data-theme="dark"] .tab[aria-pressed="true"] .seg.s1 {

        background: #131018;

      }

      @media (prefers-color-scheme: dark) {

        :root:not([data-theme="light"]) .tab[aria-pressed="true"] .seg {

          background: rgba(19, 16, 24, 0.3);

        }

        :root:not([data-theme="light"]) .tab[aria-pressed="true"] .seg.s1 {

          background: #131018;

        }

      }



      .panel,

      .group {

        background: var(--surface);

        border-radius: 28px;

        padding: 24px;

        display: flex;

        flex-direction: column;

        gap: 18px;

      }

      .panel-head {

        display: flex;

        gap: 10px 16px;

        align-items: flex-end;

        justify-content: space-between;

        flex-wrap: wrap;

      }

      .name-field {

        flex: 1 1 16rem;

        min-width: 0;

        display: flex;

        flex-direction: column;

        gap: 6px;

      }

      #name-input {

        width: 100%;

        font: inherit;

        font-family: var(--font-display);

        font-weight: 700;

        font-size: 1.15rem;

        letter-spacing: -0.01em;

        color: var(--ink);

        background: transparent;

        border: 0;

        border-bottom: 1.5px dotted var(--line);

        padding: 4px 0;

        border-radius: 0;

      }

      #name-input:hover {

        border-bottom-color: var(--muted);

      }

      #name-input:focus {

        outline: none;

        border-bottom: 2px solid var(--accent);

      }

      .panel-count {

        margin: 0;

        font-size: 13px;

        color: var(--muted);

        font-family: var(--font-mono);

        font-variant-numeric: tabular-nums;

      }



      .group h2 {

        margin: 0;

        font-family: var(--font-display);

        font-weight: 700;

        font-size: 1.05rem;

        letter-spacing: -0.01em;

        display: flex;

        justify-content: space-between;

        gap: 10px;

        align-items: baseline;

        flex-wrap: wrap;

      }

      .group h2 span {

        font-family: var(--font-mono);

        font-size: 12px;

        font-weight: 400;

        color: var(--muted);

        letter-spacing: 0;

      }



      .sessions {

        list-style: none;

        margin: 0;

        padding: 0;

        display: flex;

        flex-direction: column;

      }

      .sess {

        display: grid;

        grid-template-columns: 7.5rem minmax(0, 1fr);

        gap: 10px 16px;

        padding: 16px 0;

        border-top: 1.5px dotted var(--line);

        align-items: center;

      }

      .sess:first-child {

        border-top: 0;

        padding-top: 0;

      }

      .sess-head {

        display: flex;

        align-items: center;

        gap: 10px;

      }

      .sess-no {

        font-weight: 700;

      }

      .pill {

        font-family: var(--font-mono);

        font-size: 12px;

        padding: 1px 9px;

        border-radius: 999px;

        background: var(--bg);

        color: var(--muted);

        font-variant-numeric: tabular-nums;

      }

      .sess.full .pill {

        background: var(--done);

        color: var(--on-done);

      }

      .chips {

        display: flex;

        gap: 10px;

        flex-wrap: wrap;

      }

      .item {

        flex: 1 1 13rem;

        display: flex;

        gap: 6px;

        min-width: 0;

      }

      .chip {

        flex: 1 1 auto;

        display: inline-flex;

        align-items: center;

        gap: 10px;

        padding: 10px 16px;

        background: var(--bg);

        border: 0;

        border-radius: 999px;

        text-align: left;

        min-width: 0;

        font-weight: 500;

      }

      .chip:hover {

        background: var(--accent-soft);

      }

      .box {

        flex: none;

        width: 18px;

        height: 18px;

        border-radius: 50%;

        border: 1.5px solid var(--c, var(--muted));

        display: grid;

        place-items: center;

      }

      .box svg {

        width: 11px;

        height: 11px;

        stroke: var(--c, var(--done));

        opacity: 0;

      }

      [data-type="a"] {

        --c: var(--c-a);

        --on: var(--c-a-on);

      }

      [data-type="d"] {

        --c: var(--c-d);

        --on: var(--c-d-on);

      }

      [data-type="p"] {

        --c: var(--c-p);

        --on: var(--c-p-on);

      }

      [data-type="f"] {

        --c: var(--c-f);

        --on: var(--c-f-on);

      }

      .chip[aria-checked="true"] {

        background: var(--c, var(--done));

        color: var(--on, var(--on-done));

      }

      .chip[aria-checked="true"] .box {

        background: var(--on, var(--on-done));

        border-color: var(--on, var(--on-done));

      }

      .chip[aria-checked="true"] .box svg {

        opacity: 1;

      }



      .note-btn {

        flex: none;

        display: inline-flex;

        align-items: center;

        gap: 6px;

        padding: 0 14px;

        background: transparent;

        border: 0;

        border-radius: 999px;

        color: var(--muted);

        font-size: 13px;

        box-shadow: inset 0 0 0 1.5px var(--line);

      }

      .note-btn:hover {

        color: var(--ink);

        box-shadow: inset 0 0 0 1.5px var(--muted);

      }

      .note-btn.has-note {

        color: var(--accent);

        box-shadow: inset 0 0 0 1.5px var(--accent);

      }

      .note-btn.has-note::after {

        content: "";

        width: 6px;

        height: 6px;

        border-radius: 50%;

        background: var(--accent);

      }

      .note-btn[aria-expanded="true"] {

        background: var(--accent-soft);

        color: var(--accent);

        box-shadow: inset 0 0 0 1.5px var(--accent);

      }

      .note {

        grid-column: 1 / -1;

        display: flex;

        flex-direction: column;

        gap: 8px;

        background: var(--bg);

        border-radius: 20px;

        padding: 14px 16px;

      }

      .note textarea {

        width: 100%;

        min-height: 5.5rem;

        resize: vertical;

        font: inherit;

        color: var(--ink);

        background: var(--surface);

        border: 0;

        border-radius: 14px;

        padding: 12px 14px;

      }

      .note textarea:focus {

        outline: 2px solid var(--accent);

        outline-offset: 0;

      }



      .grades {

        background: var(--surface);

        border-radius: 28px;

        padding: 24px;

        display: flex;

        flex-direction: column;

        gap: 16px;

      }

      .grades-head {

        display: flex;

        justify-content: space-between;

        align-items: baseline;

        gap: 8px 16px;

        flex-wrap: wrap;

      }

      .grades h2 {

        margin: 0;

        font-family: var(--font-display);

        font-weight: 700;

        font-size: 1.05rem;

        letter-spacing: -0.01em;

      }

      .scroll {

        overflow-x: auto;

      }

      table {

        border-collapse: separate;

        border-spacing: 0 6px;

        width: 100%;

        min-width: 50rem;

      }

      th,

      td {

        text-align: left;

        padding: 6px 8px;

        vertical-align: middle;

      }

      thead th {

        font-family: var(--font-mono);

        font-size: 12px;

        font-weight: 400;

        color: var(--muted);

        padding-bottom: 2px;

      }

      thead th span {

        display: block;

        opacity: 0.8;

      }

      tbody th {

        font-weight: 700;

        min-width: 11rem;

      }

      tr.cur th,

      tr.cur td {

        background: var(--accent-soft);

      }

      tr.cur th {

        border-radius: 16px 0 0 16px;

      }

      tr.cur td:last-child {

        border-radius: 0 16px 16px 0;

      }

      .ginput {

        width: 100%;

        font: inherit;

        color: inherit;

        background: transparent;

        border: 0;

        border-bottom: 1.5px dotted transparent;

        padding: 2px 0;

        border-radius: 0;

      }

      .ginput:hover {

        border-bottom-color: var(--muted);

      }

      .ginput:focus {

        outline: none;

        border-bottom-color: var(--accent);

      }

      .grades h2 {

        flex: 1 1 14rem;

        min-width: 0;

      }

      .grades h2 .ginput {

        font-family: var(--font-display);

        font-weight: 700;

        font-size: 1.05rem;

        letter-spacing: -0.01em;

      }

      .ginput.gcol {

        font-family: var(--font-mono);

        font-size: 12px;

        color: var(--muted);

      }

      .ginput.rowin {

        font-weight: 700;

        min-width: 11rem;

      }

      .pdfs {

        max-width: 14rem;

      }

      .pdf {

        display: inline-flex;

        align-items: center;

        gap: 4px;

        max-width: 12rem;

        background: var(--bg);

        border-radius: 999px;

        padding: 3px 4px 3px 10px;

        margin: 0 6px 6px 0;

        font-size: 13px;

      }

      .pdf a {

        color: var(--accent);

        text-decoration: none;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

        min-width: 0;

      }

      .pdf a:hover {

        text-decoration: underline;

      }

      .pdf .x {

        flex: none;

        border: 0;

        background: transparent;

        color: var(--muted);

        width: 20px;

        height: 20px;

        border-radius: 50%;

        line-height: 1;

        padding: 0;

      }

      .pdf .x:hover {

        background: var(--line);

        color: var(--ink);

      }

      .tcell {

        display: flex;

        flex-direction: column;

        gap: 4px;

        align-items: flex-start;

      }

      .tlinks {

        display: flex;

        gap: 10px;

        flex-wrap: wrap;

      }

      .tlink {

        background: none;

        border: 0;

        padding: 0;

        font-size: 12px;

        color: var(--accent);

        text-decoration: none;

      }

      .tlink:hover {

        text-decoration: underline;

      }

      .linkrow {

        display: flex;

        gap: 8px;

        align-items: center;

      }

      .openlink {

        flex: none;

        padding: 7px 16px;

        border-radius: 999px;

        background: var(--accent);

        color: var(--on-accent);

        text-decoration: none;

        font-size: 13px;

        font-weight: 500;

      }

      .tag {

        flex: none;

        font-family: var(--font-mono);

        font-size: 10px;

        color: var(--muted);

      }

      .linkform {

        display: flex;

        flex-direction: column;

        gap: 6px;

        margin-top: 4px;

        min-width: 12rem;

      }

      .linkin {

        width: 100%;

        font: inherit;

        font-size: 13px;

        color: var(--ink);

        background: var(--bg);

        border: 0;

        border-radius: 12px;

        padding: 7px 10px;

      }

      .linkin:focus {

        outline: 2px solid var(--accent);

        outline-offset: 0;

      }

      .linkbtns {

        display: flex;

        gap: 6px;

      }

      .pdf-add {

        border: 0;

        background: transparent;

        color: var(--muted);

        font-size: 13px;

        padding: 5px 12px;

        border-radius: 999px;

        box-shadow: inset 0 0 0 1.5px var(--line);

      }

      .pdf-add:hover {

        color: var(--ink);

        box-shadow: inset 0 0 0 1.5px var(--muted);

      }

      /* File input tetap ada di layout aksesibilitas dan bisa dibuka lewat tombol + PDF. */
      .pdf-file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;

              sel = '[data-note="' + ae.dataset.note + '"]';

            else if (ae.dataset.tab)

              sel = '[data-tab="' + ae.dataset.tab + '"]';

            else if (ae.dataset.view)

              sel = '[data-view="' + ae.dataset.view + '"]';

          }

          var done = 0;

          for (var c = 0; c < NC; c++) done += cc(c);

          var pct = Math.round((done / TOTAL) * 100);

          var left = TOTAL - done;



          var h = "";

          document.title = (state.title || "").trim() || "Mata Kuliah UT";

          h +=

            '<header class="titlebar"><div class="titlewrap"><p class="eyebrow">Universitas Terbuka · ' +

            NC +

            " matkul · " +

            NS +

            ' sesi</p><h1><input id="title-input" type="text" maxlength="40" value="' +

            esc(state.title) +

            '" data-title="1" aria-label="Judul halaman (bisa diubah)" autocomplete="off"></h1></div>' +

            '<p class="sync" id="sync">' +

            esc(syncText) +

            "</p></header>";



          h +=

            '<section class="overall" aria-label="Progres keseluruhan"><div class="pct"><span class="pct-num">' +

            pct +

            '</span><span class="pct-sign">%</span></div>' +

            '<div class="overall-body"><p class="overall-line"><b>' +

            done +

            "</b> dari <b>" +

            TOTAL +

            "</b> udah kelar, <b>" +

            left +

            "</b> belum</p>" +

            '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +

            pct +

            '"><div class="bar-fill" style="width:' +

            pct +

            '%"></div></div>' +

            '<ul class="types">' +

            ORDER.map(function (t) {

              var r = byType(t);

              return (

                '<li data-type="' +

                t +

                '">' +

                ALL[t] +

                "<b>" +

                r.n +

                "/" +

                r.total +

                "</b></li>"

              );

            }).join("") +

            "</ul></div></section>";



          h +=

            '<div class="switch" role="group" aria-label="Tampilan">' +

            '<button type="button" data-view="matkul" aria-pressed="' +

            (view === "matkul") +

            '">Per matkul</button>' +

            '<button type="button" data-view="belum" aria-pressed="' +

            (view === "belum") +

            '">Belum kelar <span class="badge">' +

            left +

            "</span></button></div>";



          if (view === "matkul") {

            h += '<nav class="tabs" aria-label="Mata kuliah">';

            for (var c2 = 0; c2 < NC; c2++) {

              var segs = "";

              for (var s = 0; s < NS; s++) {

                var n = cnt(c2, s);

                segs +=

                  '<i class="seg s' +

                  (n === 0 ? 0 : n === PER_SESSION ? 2 : 1) +

                  '"></i>';

              }

              h +=

                '<button type="button" class="tab" data-tab="' +

                c2 +

                '" aria-pressed="' +

                (c2 === cur) +

                '">' +

                '<span class="tab-top"><span class="tab-name" data-tabname="' +

                c2 +

                '">' +

                esc(nm(c2)) +

                '</span><span class="tab-num">' +

                cc(c2) +

                "/" +

                PER_COURSE +

                "</span></span>" +

                '<span class="segs" aria-hidden="true">' +

                segs +

                "</span></button>";

            }

            h += "</nav>";

            h +=

              '<section class="panel"><div class="panel-head"><div class="name-field"><label class="eyebrow" for="name-input">Nama matkul (bisa diubah)</label>' +

              '<input id="name-input" type="text" maxlength="60" value="' +

              esc(state.names[cur]) +

              '" data-name="' +

              cur +

              '" autocomplete="off"></div>' +

              '<p class="panel-count">' +

              cc(cur) +

              "/" +

              PER_COURSE +

              ' kelar</p></div><ol class="sessions">';

            for (var s2 = 0; s2 < NS; s2++) h += row(cur, s2);

            h += "</ol></section>";

            h += gradesTable();

          } else {

            var any = false;

            for (var c3 = 0; c3 < NC; c3++) {

              var rows = "";

              for (var s3 = 0; s3 < NS; s3++)

                if (cnt(c3, s3) < PER_SESSION) rows += row(c3, s3);

              if (!rows) continue;

              any = true;

              h +=

                '<section class="group"><h2>' +

                esc(nm(c3)) +

                "<span>" +

                (PER_COURSE - cc(c3)) +

                ' belum</span></h2><ol class="sessions">' +

                rows +

                "</ol></section>";

            }

            if (!any)

              h +=

                '<div class="empty"><b>Semua kelar</b>Santai dulu, semua item di ' +

                NC +

                " matkul udah tercentang.</div>";

          }



          document.getElementById("app").innerHTML = h;

          if (sel) {

            var el = document.querySelector(sel);

            if (el) el.focus({ preventScroll: true });

          }

        }



        var app = document.getElementById("app");

        app.addEventListener("click", function (e) {
          var t = e.target.closest("[data-toggle],[data-note],[data-tab],[data-view],[data-pdfadd],[data-pdfdel],[data-pdfopen]");
          if (!t) return;
          if (t.dataset.pdfadd !== undefined) {
            var fi = app.querySelector('[data-pdfin="' + t.dataset.pdfadd + '"]');
            if (fi) fi.click();
          } else if (t.dataset.pdfopen !== undefined) {
            e.preventDefault();
            var pdfId = t.dataset.pdfopen;
            var popup = window.open("about:blank", "_blank");
            getFileLocal(pdfId).then(function (record) {
              if (!record || !record.blob) throw new Error("File tidak ditemukan di penyimpanan browser ini. Jika data browser pernah dihapus atau aplikasi dibuka di perangkat lain, unggah ulang file tersebut.");
              var url = URL.createObjectURL(record.blob);
              if (popup) popup.location.href = url;
              else {
                var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.click();
              }
              setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            }).catch(function (err) {
              if (popup) popup.close();
              setSync(err.message || "File gagal dibuka.");
            });
          } else if (t.dataset.pdfdel !== undefined) {
            var pd = t.dataset.pdfdel.split(".");
            var pkey = pd[0] + "." + pd[1];
            var plist = state.pdfs[pkey] || [];
            var gone = plist.splice(parseInt(pd[2], 10), 1)[0];
            if (!plist.length) delete state.pdfs[pkey];
            save();
            render();
            if (gone && gone.id) deleteFileLocal(gone.id).catch(function () {});
          } else if (t.dataset.toggle) {
            var k = t.dataset.toggle;
            if (state.done[k]) delete state.done[k];
            else state.done[k] = true;
            save();
            render();
          } else if (t.dataset.note) {
            openNote = openNote === t.dataset.note ? null : t.dataset.note;
            render();
          } else if (t.dataset.tab !== undefined) {
            cur = parseInt(t.dataset.tab, 10);
            render();
          } else if (t.dataset.view) {
            view = t.dataset.view;
            render();
          }
        });

        app.addEventListener("change", function (e) {
          var t = e.target;
          if (!t.dataset) return;
          if (t.dataset.pdfin !== undefined) {
            var f = t.files && t.files[0];
            if (!f) return;
            var c = t.dataset.pdfin;
            
            if (f.size > 20 * 1024 * 1024) {
              t.value = "";
              setSync("File terlalu besar, maksimal 20 MB per file.");
              return;
            }
            setSync("Menyimpan file di perangkat ini...");
            var id = makePdfId();
            saveFileLocal(f, id).then(function () {
              (state.pdfs[c] = state.pdfs[c] || []).push({ id: id, name: f.name });
              save();
              setSync("File tersimpan di browser ini");
              render();
            }).catch(function (err) {
              setSync((err && err.message) || "Gagal menyimpan file. Coba gunakan Chrome/Edge dan pastikan penyimpanan situs diizinkan.");
            }).finally(function () { t.value = ""; });
            return;
          }
          if (t.dataset.title !== undefined) {
            state.title = t.value;
            save();
          } else if (t.dataset.gtitle !== undefined) {
            state.gtitle = t.value;
            save();
          } else if (t.dataset.gcol !== undefined) {
            state.gcol = t.value;
            save();
          } else if (t.dataset.gname !== undefined) {
            state.names[parseInt(t.dataset.gname, 10)] = t.value;
            save();
            render();
          } else if (t.dataset.grade !== undefined) {
            state.grades[t.dataset.grade] = t.value;
            save();
            render();
          } else if (t.dataset.gnote !== undefined) {
            state.gnotes[t.dataset.gnote] = t.value;
            save();
          }
        });

        app.addEventListener("input", function (e) {
          var t = e.target;
          if (!t || !t.dataset) return;
          if (t.dataset.title !== undefined) { state.title = t.value; save(); }
          else if (t.dataset.gtitle !== undefined) { state.gtitle = t.value; save(); }
          else if (t.dataset.gcol !== undefined) { state.gcol = t.value; save(); }
          else if (t.dataset.gname !== undefined) { state.names[parseInt(t.dataset.gname, 10)] = t.value; save(); }
          else if (t.dataset.grade !== undefined) {
            state.grades[t.dataset.grade] = t.value;
            var parts = t.dataset.grade.split(".");
            var avg = app.querySelector('[data-avg="' + parts[0] + '"]');
            if (avg) avg.textContent = avgOf(parseInt(parts[0], 10));
            save();
          } else if (t.dataset.gnote !== undefined) { state.gnotes[t.dataset.gnote] = t.value; save(); }
          else if (t.dataset.notekey !== undefined) {
            if (t.value.trim()) state.notes[t.dataset.notekey] = t.value;
            else delete state.notes[t.dataset.notekey];
            save();
          }
        });

        render();



        // Simpan online jika tersedia; kalau tidak, progres tetap di browser ini.

        try {

          var cl = window.claude;

          if (cl && cl.use) {

            cl.use("db").then(

              function (db) {

                if (!db) return;

                dbDoc = db.doc("tracker/state");

                dbDoc.onSnapshot(

                  function (snap) {

                    if (snap.exists) {

                      if (writing || pending) return;

                      var before = JSON.stringify(state);

                      merge(snap.data());

                      var ae2 = document.activeElement;

                      var typing =

                        !!ae2 &&

                        (ae2.tagName === "INPUT" || ae2.tagName === "TEXTAREA");

                      if (JSON.stringify(state) !== before && !typing) render();

                      setSync("Tersimpan");

                      try {

                        localStorage.setItem(LS, JSON.stringify(state));

                      } catch (e) {}

                    } else if (!snap.metadata.fromCache) {

                      save();

                      setSync("Tersimpan");

                    }

                  },

                  function () {

                    dbDoc = null;

                    setSync("Tersimpan di browser ini");

                  },

                );

              },

              function () {},

            );

          }

        } catch (e) {}



        // Semua format file disimpan di IndexedDB browser; tidak memerlukan API eksternal.


      })();

    </script>

  </body>

</html>
